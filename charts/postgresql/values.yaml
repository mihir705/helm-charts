nameOverride: ""
fullnameOverride: ""

image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

auth:
  database: app
  username: app
  existingSecret: ""
  postgresPassword: "change-me-lab-only"

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""

service:
  port: 5432

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
